name: JianShi G2-H Local BFF Security E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa/g2h_loopback_bff/**'
      - 'tests/g2h_loopback_bff.test.mjs'
      - 'tests/test_f21_g2h_loopback_bff.py'
      - 'scripts/qa/g2h2_trusted_auth_adapter.mjs'
      - 'tests/g2h2_trusted_auth_adapter.test.mjs'
      - 'tests/test_f21_g2h2_auth_adapter.py'
      - 'scripts/qa/g2h3_https_bff.mjs'
      - 'tests/g2h3_https_bff.test.mjs'
      - 'tests/test_f21_g2h3_https_bff.py'
      - 'scripts/qa/g2h4_session_vault.mjs'
      - 'tests/g2h4_session_vault.test.mjs'
      - 'tests/test_f21_g2h4_durable_sessions.py'
      - 'scripts/qa/g2h6_pkce_login_contract.mjs'
      - 'tests/g2h6_pkce_login.test.mjs'
      - 'tests/test_f21_g2h6_pkce.py'
      - 'scripts/qa/g2h7_gotrue_tokenhash_wire.mjs'
      - 'tests/g2h7_gotrue_tokenhash_wire.test.mjs'
      - 'scripts/qa/g2h7b_tokenhash_confirmation.mjs'
      - 'tests/g2h7b_tokenhash_confirmation.test.mjs'
      - 'scripts/qa/g2h7c_loopback_https_preview.mjs'
      - 'tests/g2h7c_https_preview.test.mjs'
      - 'ops/cms-preview/functions/auth/confirm.js'
      - 'tests/g2h7d_pages_preview_contract.test.mjs'
      - 'scripts/security/g2h7d_preview_deployment_guard.mjs'
      - 'docs/F21_G2H7D_PAGES_PREVIEW_SECURITY_AUDIT_CN.md'
      - 'ops/cms-preview/worker-email-crypto.mjs'
      - 'tests/g2h7e_worker_webcrypto.test.mjs'
      - 'scripts/security/g2h7e_worker_webcrypto_audit.mjs'
      - 'docs/F21_G2H7E_WORKER_WEBCRYPTO_SECURITY_AUDIT_CN.md'
      - 'ops/cms-preview/worker-pg-disposable-http.mjs'
      - 'scripts/qa/g2h7f_pg_http_runner.py'
      - 'tests/g2h7f_worker_pg_http.test.mjs'
      - 'tests/g2h7f_bridge_contract.test.mjs'
      - 'scripts/security/g2h7f_http_pg_boundary_audit.mjs'
      - 'docs/F21_G2H7F_WORKER_HTTP_REAL_PG_AUDIT_CN.md'
      - '.github/workflows/cms-bff-isolated.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa/g2h_loopback_bff/**'
      - 'tests/g2h_loopback_bff.test.mjs'
      - 'tests/test_f21_g2h_loopback_bff.py'
      - 'scripts/qa/g2h2_trusted_auth_adapter.mjs'
      - 'tests/g2h2_trusted_auth_adapter.test.mjs'
      - 'tests/test_f21_g2h2_auth_adapter.py'
      - 'scripts/qa/g2h3_https_bff.mjs'
      - 'tests/g2h3_https_bff.test.mjs'
      - 'tests/test_f21_g2h3_https_bff.py'
      - 'scripts/qa/g2h4_session_vault.mjs'
      - 'tests/g2h4_session_vault.test.mjs'
      - 'tests/test_f21_g2h4_durable_sessions.py'
      - 'scripts/qa/g2h6_pkce_login_contract.mjs'
      - 'tests/g2h6_pkce_login.test.mjs'
      - 'tests/test_f21_g2h6_pkce.py'
      - 'scripts/qa/g2h7_gotrue_tokenhash_wire.mjs'
      - 'tests/g2h7_gotrue_tokenhash_wire.test.mjs'
      - 'scripts/qa/g2h7b_tokenhash_confirmation.mjs'
      - 'tests/g2h7b_tokenhash_confirmation.test.mjs'
      - 'scripts/qa/g2h7c_loopback_https_preview.mjs'
      - 'tests/g2h7c_https_preview.test.mjs'
      - 'ops/cms-preview/functions/auth/confirm.js'
      - 'tests/g2h7d_pages_preview_contract.test.mjs'
      - 'scripts/security/g2h7d_preview_deployment_guard.mjs'
      - 'docs/F21_G2H7D_PAGES_PREVIEW_SECURITY_AUDIT_CN.md'
      - 'ops/cms-preview/worker-email-crypto.mjs'
      - 'tests/g2h7e_worker_webcrypto.test.mjs'
      - 'scripts/security/g2h7e_worker_webcrypto_audit.mjs'
      - 'docs/F21_G2H7E_WORKER_WEBCRYPTO_SECURITY_AUDIT_CN.md'
      - 'ops/cms-preview/worker-pg-disposable-http.mjs'
      - 'scripts/qa/g2h7f_pg_http_runner.py'
      - 'tests/g2h7f_worker_pg_http.test.mjs'
      - 'tests/g2h7f_bridge_contract.test.mjs'
      - 'scripts/security/g2h7f_http_pg_boundary_audit.mjs'
      - 'docs/F21_G2H7F_WORKER_HTTP_REAL_PG_AUDIT_CN.md'
      - '.github/workflows/cms-bff-isolated.yml'
permissions:
  contents: read
jobs:
  synthetic-loopback-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject remote CMS credentials and publication
        shell: bash
        run: |
          set -euo pipefail
          test ! -e web/dist/qa/cms/index.html
          test ! -e web/dist/cms-admin/index.html
          ! grep -q 'g2h_loopback_bff' scripts/release/p412_build_public.py
          ! grep -q 'g2h_loopback_bff' .github/workflows/publish-static.yml
          ! grep -q 'g2h7c_loopback_https_preview' scripts/release/p412_build_public.py
          ! grep -q 'g2h7c_https_preview' .github/workflows/publish-static.yml
          test ! -e web/dist/auth/confirm/index.html
      - name: Real local HTTP session and CMS security integration tests
        env:
          JIANSHI_G2H_SYNTHETIC_ONLY: '1'
        run: node --test tests/g2h_loopback_bff.test.mjs
      - name: Staging GoTrue identity and session/role contract tests
        run: node --test tests/g2h2_trusted_auth_adapter.test.mjs
      - name: Actual TLS and secure session cookie BFF E2E
        env:
          JIANSHI_G2H3_SYNTHETIC_ONLY: '1'
        run: node --test tests/g2h3_https_bff.test.mjs
      - name: AES-GCM and HMAC durable session vault security tests
        run: node --test tests/g2h4_session_vault.test.mjs
      - name: Actual TLS passwordless PKCE callback replay security
        env:
          JIANSHI_G2H6_SYNTHETIC_ONLY: '1'
        run: node --test tests/g2h6_pkce_login.test.mjs
      - name: Synthetic GoTrue token_hash HTTP and fail-closed contract
        env:
          JIANSHI_G2H7_SYNTHETIC_ONLY: '1'
        run: node --test tests/g2h7_gotrue_tokenhash_wire.test.mjs
      - name: Two-step email token_hash encrypted intent and replay security
        env:
          JIANSHI_G2H7B_SYNTHETIC_ONLY: '1'
        run: node --test tests/g2h7b_tokenhash_confirmation.test.mjs
      - name: G2-H.7C actual localhost HTTPS confirmation form security E2E
        env:
          JIANSHI_G2H7B_SYNTHETIC_ONLY: '1'
          JIANSHI_G2H7C_SYNTHETIC_ONLY: '1'
        run: node --test tests/g2h7c_https_preview.test.mjs
      - name: G2-H.7D Cloudflare Pages Web API preview-only behavioral tests
        run: node --test tests/g2h7d_pages_preview_contract.test.mjs
      - name: G2-H.7D independent static release-boundary security audit
        run: node scripts/security/g2h7d_preview_deployment_guard.mjs
      - name: G2-H.7E Workers WebCrypto replay and cross-implementation vectors
        run: node --test tests/g2h7e_worker_webcrypto.test.mjs
      - name: G2-H.7E independent Worker WebCrypto and release audit
        run: node scripts/security/g2h7e_worker_webcrypto_audit.mjs
      - name: G2-H.7F fail-closed synthetic HTTP bridge contract
        run: node --test tests/g2h7f_bridge_contract.test.mjs
      - name: G2-H.7F independent disposable HTTP/PG boundary audit
        run: node scripts/security/g2h7f_http_pg_boundary_audit.mjs
