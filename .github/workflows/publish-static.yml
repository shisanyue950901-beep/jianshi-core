name: JianShi Static Snapshot

on:
  workflow_dispatch:
  # Run the exact build-static verification on code changes BEFORE main merge.
  # The publication commit/push step is explicitly disabled for PRs.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-static.yml'
      - 'tests/verify_t08_home_snapshot.py'
      - 'tests/test_t08_featured_gate.py'
  schedule:
    - cron: '55 0 * * *'
    - cron: '55 6,12,18 * * *'
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - 404.html
      - styles.css
      - search.js
      - account.js
      - analytics.js
      - search-index.json
      - opportunity/**
      - opportunities/**
      - today/**
      - rising/**
      - build/**
      - content/**
      - privacy/**
      - account/**
      - sitemap.xml
      - robots.txt
      - _headers
      - _redirects
      - dist/**
      - public/**
      - web/dist/**

permissions:
  contents: write
  actions: read  # Read only prior research artifacts to restore private fingerprints.

jobs:
  build-static:
    # Serialize scheduled runs; push builds remain independent. Never cancel
    # an in-flight private attempt. Queue all delayed scheduled slots.
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'jianshi-private-daily-schedule' || github.run_id }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIANSHI_API_URL: https://dalfvgehosxfyxkptxwx.supabase.co/functions/v1/public-feed
      # R8.3 stays fail-closed until custom SMTP is configured for Supabase Auth.
      JIANSHI_AUTH_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit legacy project-name assertions across workflows and tests
        if: github.event_name == 'pull_request'
        run: |
          # Audit includes historical archive fixtures and negative regression tests.
          # Do NOT alter their meaning: only current homepage recommendations use JSON.
          git grep -n -i -E 'Carrd|NerdWallet|Plausible|PROJECT_PREVIEWS' -- .github/workflows tests || true

      - name: Build live static snapshot
        run: python web/build.py

      - name: Prepare user-facing P4.12 artifact
        run: python scripts/release/p412_build_public.py

      - name: Verify public artifact
        run: |
          test -f web/dist/index.html
          test -f dist/index.html
          test -f public/index.html
          test -f index.html
          test -f opportunities/index.html
          test -f today/index.html
          test -f rising/index.html
          test -f build/index.html
          test -f content/index.html
          test -f privacy/index.html
          test -f account/index.html
          test -f account.js
          test -f analytics.js
          test -f sitemap.xml
          test -f robots.txt
          test -f _headers
          test -f _redirects
          test -f web/dist/_headers
          test -f web/dist/_redirects
          grep -q "Cache-Control: no-store" _headers
          test -f web/dist/privacy/index.html
          test ! -e web/dist/config
          test ! -e web/dist/docs
          test ! -e web/dist/scripts
          test ! -e web/dist/supabase
          grep -q "/config/\\*" _redirects
          grep -q "/supabase/\\*" _redirects
          python scripts/security/p411_audit_public_artifacts.py web/dist
          grep -q "见势" index.html
          grep -q "商业机会与解决方案" web/dist/index.html
          # T08 project cards: assert ranked JSON IDs, visible names and exact details links.
          python tests/verify_t08_home_snapshot.py web/dist/index.html
          ! grep -q "Easlo｜" web/dist/index.html
          ! grep -q "Louise Lennox" web/dist/index.html
          ! test -e web/dist/projects/easlo/index.html
          ! test -e web/dist/projects/tally/index.html
          python tests/test_t07_static.py
          ! grep -q "此文件为独立网站预览" web/dist/index.html
          grep -q "页面已更新" web/dist/opportunities/index.html
          grep -q "页面已更新" web/dist/today/index.html
          grep -q "项目研究库" opportunities/index.html
          grep -q "当前证据边界" opportunities/index.html
          test -f opportunity/vertical-industry-saas/index.html
          test -f opportunity/amazon-fba-niche-brand/index.html
          grep -q "项目研究档案" opportunity/vertical-industry-saas/index.html
          grep -q "证据边界" opportunity/vertical-industry-saas/index.html
          grep -q "noindex,nofollow" opportunity/vertical-industry-saas/index.html
          ! grep -q "vertical-industry-saas" sitemap.xml
          grep -q "趋势指标档案" opportunity/solo-saas/index.html
          grep -q "商业样本" opportunity/solo-saas/index.html
          grep -q "账户功能正在完成最后的邮件登录配置" account/index.html
          grep -q "中文案例" opportunity/amazon-kdp-publishing/index.html
          ! grep -R -E -i "Empire Flippers|empireflippers|Amazon KDP Business in the|Amazon FBA Business in the|Per Month SaaS Business|OFFICIAL_API|源更新时间：|listing_number" --include="*.html" index.html opportunities opportunity today rising build content


      # No new cron slots. A later existing scheduled slot may make one bounded
      # UTC-day attempt if the midnight event is dropped or delayed.
      # A PRIVATE claim is uploaded BEFORE HN/RSS/P4.37 network requests.
      - name: Check daily private scan claim (metadata only)
        id: daily_scan_preflight
        if: github.event_name == 'schedule' && (github.event.schedule == '55 0 * * *' || github.event.schedule == '55 6,12,18 * * *')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/p434_artifacts_metadata.json"; then
            echo "::warning title=JianShi Scan Claim Unavailable::Private artifact inventory unavailable; research not started."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python scripts/research/p441_schedule_claim.py \
              --metadata "$RUNNER_TEMP/p434_artifacts_metadata.json" \
              --run-id "$GITHUB_RUN_ID" \
              --claim-output "$RUNNER_TEMP/p441_scan_claim.json" \
              --github-output "$GITHUB_OUTPUT"; then
            echo "::warning title=JianShi Scan Claim Invalid::Cannot safely prove daily request budget; research not started."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reserve private daily scan claim (48h)
        id: daily_scan_claim_upload
        if: steps.daily_scan_preflight.outputs.should_scan == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: research-scan-claim-${{ steps.daily_scan_preflight.outputs.scan_day }}-${{ github.run_id }}
          path: ${{ runner.temp }}/p441_scan_claim.json
          if-no-files-found: error
          retention-days: 2

      # HN search metadata is an unverified lead and NEVER changes publication.
      - name: Daily private business-evidence leads (no publication)
        # P4.36: unattended daily private research is schedule-only.
        # The one-time P4.35 merge smoke is retired and cannot re-trigger.
        if: github.event_name == 'schedule' && steps.daily_scan_preflight.outputs.should_scan == 'true' && steps.daily_scan_claim_upload.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "P441_DAILY_SCAN_CLAIM_UPLOADED_NETWORK_BUDGET_RESERVED"
          # One bounded daily scan at most; no retries or extra jobs.
          python scripts/research/p426_daily_leads.py --network --max-companies 6 --output "$RUNNER_TEMP/p426_research_leads.json"
          python scripts/research/p430_company_evidence_review.py --leads "$RUNNER_TEMP/p426_research_leads.json" --output "$RUNNER_TEMP/p430_review_queue.json"

          # Publisher explicitly offers RSS; single fixed request, no retries.
          # RSS failure is visible and must never be counted as a success.
          rss_args=()
          if python scripts/research/p432_publisher_rss_probe.py --online --output "$RUNNER_TEMP/p432_rss_leads.json"; then
            rss_args=(--rss "$RUNNER_TEMP/p432_rss_leads.json")
            echo "P434_RSS_HTTP_OK" > "$RUNNER_TEMP/p434_rss_health.txt"
          else
            echo "P434_RSS_ACCESS_FAILED_NO_RETRY" > "$RUNNER_TEMP/p434_rss_health.txt"
          fi

          # P4.37: two fixed public GitHub REST API calls only. Verify exact
          # public repository IDs, owner and official homepage; not revenue.
          # Failure is recorded independently; never promote to L3/L4.
          if python scripts/research/p437_official_github_repo_probe.py --online --output "$RUNNER_TEMP/p437_github_metrics.json"; then
            echo "P437_GITHUB_COLLECTOR_EXECUTED" > "$RUNNER_TEMP/p437_github_health.txt"
          else
            echo "P437_GITHUB_COLLECTOR_SCRIPT_FAILED" > "$RUNNER_TEMP/p437_github_health.txt"
            echo "::warning title=JianShi GitHub Source Error::Official GitHub source failed; core HN/RSS report remains independent."
          fi

          # No new external requests from cleaning/deduplication.
          python scripts/research/p433_private_evidence_etl.py --hn "$RUNNER_TEMP/p426_research_leads.json" "${rss_args[@]}" --output "$RUNNER_TEMP/p433_clean_review.json"

          # Same existing 48-hour PRIVATE artifact: find most recent scheduled
          # main-branch report. GitHub App token needs actions:read, never PAT.
          previous_args=()
          echo "P434_PRIOR_ARTIFACT_NOT_AVAILABLE" > "$RUNNER_TEMP/p434_restore_health.txt"
          if [ -s "$RUNNER_TEMP/p434_artifacts_metadata.json" ]; then
            python scripts/research/p434_rolling_private_index.py select-artifact \
              --metadata "$RUNNER_TEMP/p434_artifacts_metadata.json" \
              --current-run-id "$GITHUB_RUN_ID" \
              --output "$RUNNER_TEMP/p434_selected_artifact.json"
            previous_run_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("previous_run_id") or "")' "$RUNNER_TEMP/p434_selected_artifact.json")"
            if [ -n "$previous_run_id" ]; then
              mkdir -p "$RUNNER_TEMP/p434_previous"
              if gh run download "$previous_run_id" -n "research-leads-$previous_run_id" -D "$RUNNER_TEMP/p434_previous"; then
                if [ -s "$RUNNER_TEMP/p434_previous/p434_hash_index.json" ]; then
                  previous_args=(--previous "$RUNNER_TEMP/p434_previous/p434_hash_index.json")
                  echo "P434_PRIOR_HASH_INDEX_RESTORED" > "$RUNNER_TEMP/p434_restore_health.txt"
                else
                  echo "P434_PRIOR_ARTIFACT_HAS_NO_HASH_INDEX" > "$RUNNER_TEMP/p434_restore_health.txt"
                fi
              else
                echo "P434_PRIOR_ARTIFACT_DOWNLOAD_FAILED" > "$RUNNER_TEMP/p434_restore_health.txt"
              fi
            fi
          else
            echo "P434_ARTIFACT_INDEX_API_FAILED" > "$RUNNER_TEMP/p434_restore_health.txt"
          fi
          cat "$RUNNER_TEMP/p434_restore_health.txt"
          python scripts/research/p434_rolling_private_index.py build \
            --clean "$RUNNER_TEMP/p433_clean_review.json" \
            "${previous_args[@]}" \
            --report-output "$RUNNER_TEMP/p434_daily_delta.json" \
            --index-output "$RUNNER_TEMP/p434_hash_index.json"
          python scripts/research/p435_private_scan_health.py \
            --hn "$RUNNER_TEMP/p426_research_leads.json" \
            --rss-health "$RUNNER_TEMP/p434_rss_health.txt" \
            --restore-health "$RUNNER_TEMP/p434_restore_health.txt" \
            --delta "$RUNNER_TEMP/p434_daily_delta.json" \
            --output "$RUNNER_TEMP/p435_scan_health.json"
          # Print ONLY aggregate counts in Actions logs and step summary.
          python scripts/research/p435_private_scan_health.py print-summary \
            --input "$RUNNER_TEMP/p435_scan_health.json" \
            --output "$GITHUB_STEP_SUMMARY"
          # P4.36: health verdict is emitted BEFORE upload. Even if all HTTP
          # calls fail and this step returns nonzero, artifact upload below
          # still runs using always(), retaining the evidence of the failure.
          python scripts/research/p436_unattended_guard.py \
            --health "$RUNNER_TEMP/p435_scan_health.json" \
            --clean "$RUNNER_TEMP/p433_clean_review.json" \
            --index "$RUNNER_TEMP/p434_hash_index.json" \
            --output "$RUNNER_TEMP/p436_unattended_verdict.json"

      - name: Retain private review-only evidence leads (48h)
        # Preserve forensics even if the scheduled collector reports FAIL.
        if: ${{ always() && github.event_name == 'schedule' && steps.daily_scan_claim_upload.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-leads-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p426_research_leads.json
            ${{ runner.temp }}/p430_review_queue.json
            ${{ runner.temp }}/p433_clean_review.json
            ${{ runner.temp }}/p432_rss_leads.json
            ${{ runner.temp }}/p434_daily_delta.json
            ${{ runner.temp }}/p434_hash_index.json
            ${{ runner.temp }}/p434_rss_health.txt
            ${{ runner.temp }}/p434_restore_health.txt
            ${{ runner.temp }}/p435_scan_health.json
            ${{ runner.temp }}/p436_unattended_verdict.json
            ${{ runner.temp }}/p437_github_metrics.json
            ${{ runner.temp }}/p437_github_health.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit generated snapshot
        # Never push during PR/feature-branch workflow_dispatch validation.
        # Existing main push and main schedule behavior is unchanged.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "jianshi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html 404.html styles.css search.js account.js analytics.js search-index.json sitemap.xml robots.txt _headers _redirects opportunity opportunities today rising build content privacy account dist public
          git add -f web/dist
          if git diff --cached --quiet; then
            echo "STATIC_SNAPSHOT_NO_CHANGE"
            exit 0
          fi
          git commit -m "chore: refresh live static snapshot"
          git push origin HEAD:main
