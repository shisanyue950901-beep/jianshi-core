name: JianShi Static Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '55 */6 * * *'
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - 404.html
      - styles.css
      - search.js
      - account.js
      - analytics.js
      - search-index.json
      - opportunity/**
      - opportunities/**
      - today/**
      - rising/**
      - build/**
      - content/**
      - privacy/**
      - account/**
      - sitemap.xml
      - robots.txt
      - _headers
      - _redirects
      - dist/**
      - public/**
      - web/dist/**

permissions:
  contents: write

jobs:
  build-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIANSHI_API_URL: https://dalfvgehosxfyxkptxwx.supabase.co/functions/v1/public-feed
      # R8.3 stays fail-closed until custom SMTP is configured for Supabase Auth.
      JIANSHI_AUTH_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build live static snapshot
        run: python web/build.py

      - name: Prepare user-facing P4.12 artifact
        run: python scripts/release/p412_build_public.py

      - name: Verify public artifact
        run: |
          test -f web/dist/index.html
          test -f dist/index.html
          test -f public/index.html
          test -f index.html
          test -f opportunities/index.html
          test -f today/index.html
          test -f rising/index.html
          test -f build/index.html
          test -f content/index.html
          test -f privacy/index.html
          test -f account/index.html
          test -f account.js
          test -f analytics.js
          test -f sitemap.xml
          test -f robots.txt
          test -f _headers
          test -f _redirects
          test -f web/dist/_headers
          test -f web/dist/_redirects
          grep -q "Cache-Control: no-store" _headers
          test -f web/dist/privacy/index.html
          test ! -e web/dist/config
          test ! -e web/dist/docs
          test ! -e web/dist/scripts
          test ! -e web/dist/supabase
          grep -q "/config/\\*" _redirects
          grep -q "/supabase/\\*" _redirects
          python scripts/security/p411_audit_public_artifacts.py web/dist
          grep -q "见势" index.html
          grep -q "发现海外项目" web/dist/index.html
          grep -q "Carrd" web/dist/index.html
          grep -q "NerdWallet" web/dist/index.html
          grep -q "Plausible" web/dist/index.html
          ! grep -q "Easlo｜" web/dist/index.html
          ! grep -q "Louise Lennox" web/dist/index.html
          ! test -e web/dist/projects/easlo/index.html
          ! test -e web/dist/projects/tally/index.html
          test -f web/dist/projects/nerdwallet/index.html
          test -f web/dist/projects/carrd/index.html
          test -f web/dist/projects/plausible/index.html
          ! grep -q "此文件为独立网站预览" web/dist/index.html
          grep -q "页面已更新" web/dist/opportunities/index.html
          grep -q "页面已更新" web/dist/today/index.html
          grep -q "项目研究库" opportunities/index.html
          grep -q "当前证据边界" opportunities/index.html
          test -f opportunity/vertical-industry-saas/index.html
          test -f opportunity/amazon-fba-niche-brand/index.html
          grep -q "项目研究档案" opportunity/vertical-industry-saas/index.html
          grep -q "证据边界" opportunity/vertical-industry-saas/index.html
          grep -q "noindex,nofollow" opportunity/vertical-industry-saas/index.html
          ! grep -q "vertical-industry-saas" sitemap.xml
          grep -q "趋势指标档案" opportunity/solo-saas/index.html
          grep -q "商业样本" opportunity/solo-saas/index.html
          grep -q "账户功能正在完成最后的邮件登录配置" account/index.html
          grep -q "中文案例" opportunity/amazon-kdp-publishing/index.html
          ! grep -R -E -i "Empire Flippers|empireflippers|Amazon KDP Business in the|Amazon FBA Business in the|Per Month SaaS Business|OFFICIAL_API|源更新时间：|listing_number" --include="*.html" index.html opportunities opportunity today rising build content


      # Reuse the existing four-times-daily scheduled job, without creating
      # extra billed jobs. Only its UTC 00:55 slot performs a bounded scan.
      # HN search metadata is an unverified lead and NEVER changes publication.
      - name: Daily private business-evidence leads (no publication)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          hour="$(date -u +%H)"
          if [ "$hour" = "00" ] || [ "$hour" = "01" ]; then
            python scripts/research/p426_daily_leads.py --network --max-companies 6 --output "$RUNNER_TEMP/p426_research_leads.json"
            # R2 indexes the same private lead file offline: zero additional requests.
            python scripts/research/p430_company_evidence_review.py --leads "$RUNNER_TEMP/p426_research_leads.json" --output "$RUNNER_TEMP/p430_review_queue.json"
            # P4.33: deterministic cleaning, provenance and exact-link dedup only.
            # No additional HTTP calls, no public promotion, report retained privately.
            python scripts/research/p433_private_evidence_etl.py --hn "$RUNNER_TEMP/p426_research_leads.json" --output "$RUNNER_TEMP/p433_clean_review.json"
          else
            echo "P426_DAILY_SCAN_SKIP_NOT_MIDNIGHT_SLOT"
          fi

      - name: Retain private review-only evidence leads (48h)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: research-leads-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p426_research_leads.json
            ${{ runner.temp }}/p430_review_queue.json
            ${{ runner.temp }}/p433_clean_review.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit generated snapshot
        run: |
          git config user.name "jianshi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html 404.html styles.css search.js account.js analytics.js search-index.json sitemap.xml robots.txt _headers _redirects opportunity opportunities today rising build content privacy account dist public
          git add -f web/dist
          if git diff --cached --quiet; then
            echo "STATIC_SNAPSHOT_NO_CHANGE"
            exit 0
          fi
          git commit -m "chore: refresh live static snapshot"
          git push origin HEAD:main
