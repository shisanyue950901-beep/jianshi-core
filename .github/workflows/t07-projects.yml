name: T07 Projects HTML and Mobile Lighthouse

on:
  push:
    branches: [feat/t07, feat/t08]
    paths:
      - 'data/projects.json'
      - 'scripts/release/t07_projects.py'
      - 'scripts/release/p412_build_public.py'
      - 'tests/test_t07_static.py'
      - 'tests/test_t08_data.py'
      - 'tests/verify_t08_home_snapshot.py'
      - 'tests/browser/t07_responsive.py'
      - '.github/workflows/t07-projects.yml'
  pull_request:
    paths:
      - 'data/projects.json'
      - 'scripts/release/t07_projects.py'
      - 'scripts/release/p412_build_public.py'
      - 'tests/test_t07_static.py'
      - 'tests/test_t08_data.py'
      - '.github/workflows/t07-projects.yml'
      - 'scripts/release/t11_sprint.py'
      - 'tests/test_t11_sprint.py'
      - 'tests/browser/t11_sprint_mobile.py'
      - 'web/build.py'
      - 'web/static/sprint.js'
      - 'config/site.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t07-static-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JIANSHI_API_URL: ""
      JIANSHI_AUTH_ENABLED: "0"
      JIANSHI_ANALYTICS_URL: ""
      JIANSHI_NEWSLETTER_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build using the existing static publication chain
        run: |
          set -euo pipefail
          python web/build.py
          python scripts/release/p412_build_public.py
          python tests/test_t07_static.py
          python tests/test_t08_data.py
          python tests/test_t08b_sources.py
          python tests/test_t11_sprint.py
          test -f web/dist/projects/datafast/index.html
          test -f web/dist/projects/readlens/index.html
          # Replace obsolete named-case fixture with the reviewed JSON ranking gate.
          # test_t07_static.py above separately rejects all extra project IDs.
          python tests/verify_t08_home_snapshot.py web/dist/index.html
          grep -q 'href="/sprint/"' web/dist/index.html
          test -f web/dist/sprint/index.html
          cmp -s _redirects web/dist/_redirects
      - name: Simulate main/production build with Hark-approved records
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          CF_PAGES_BRANCH: main
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from unittest.mock import patch
          sys.path.insert(0, "scripts/release")
          from t08_project_selection import projects, review_preview
          raw = json.loads(Path("data/projects.json").read_text(encoding="utf-8"))
          assert len(raw) == 30
          assert all(p["reviewed_by_hark"] is True and p["publication_status"] == "PUBLIC" for p in raw)
          # GitHub PR refs are protected; override within subprocess context to model main.
          with patch.dict(os.environ, {
              "CI": "true", "GITHUB_ACTIONS": "true",
              "CF_PAGES_BRANCH": "main", "GITHUB_REF_NAME": "main",
              "GITHUB_HEAD_REF": "",
          }):
              assert not review_preview(), "production unexpectedly has feature preview privilege"
              loaded = projects()
              assert len(loaded) == 30
              subprocess.run([sys.executable, "scripts/release/p412_build_public.py"], check=True)
              assert len([p for p in (Path("web/dist")/"projects").iterdir() if p.is_dir()]) == 30
              assert (Path("web/dist")/"projects"/"ai-toolbox"/"index.html").exists()
              print("PASS T10 simulated main build: 30 reviewed PUBLIC records; 31 project pages")
          PY
          python tests/test_t07_static.py
          python tests/verify_t08_home_snapshot.py web/dist/index.html

      - name: Chromium responsive audit and six screenshots
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install chromium
          # GitHub ubuntu-latest lacks complete CJK glyph coverage by default.
          # Install system fonts only in the CI screenshot environment.
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python tests/browser/t07_responsive.py
          python tests/browser/t11_sprint_mobile.py
      - name: Lighthouse mobile performance
        run: |
          set -euo pipefail
          mkdir -p t07-evidence
          python -m http.server 8099 --bind 127.0.0.1 --directory web/dist > t07-evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:8099/projects/ >/dev/null
          curl -fsS http://127.0.0.1:8099/sprint/ >/dev/null
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8099/projects/ --quiet --only-categories=performance --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --output=json --output-path=t07-evidence/lighthouse-mobile.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8099/sprint/ --quiet --only-categories=performance --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --output=json --output-path=t07-evidence/t11-lighthouse-mobile.json
          python - <<'PY'
          import json
          from pathlib import Path
          sprint=json.loads(Path("t07-evidence/t11-lighthouse-mobile.json").read_text())
          sprint_score=round(sprint["categories"]["performance"]["score"]*100)
          print(f"T11 /sprint/ Lighthouse 移动端 Performance: {sprint_score}/100")
          if sprint_score < 98: raise SystemExit("FAIL: T11 mobile below last-verified 98 baseline")
          data=json.loads(Path("t07-evidence/lighthouse-mobile.json").read_text())
          score=round(data["categories"]["performance"]["score"]*100)
          text=f"T07 /projects/ Lighthouse 移动端 Performance: {score}/100"
          print(text)
          Path("t07-evidence/lighthouse-score.txt").write_text(text+"\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## T07 移动端性能\n\n"+text+"\n")
          if score < 85: raise SystemExit("FAIL: mobile performance below required 85")
          PY
      - name: Upload T07 mobile performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-mobile-lighthouse
          path: t07-evidence/
          if-no-files-found: warn
          retention-days: 14
