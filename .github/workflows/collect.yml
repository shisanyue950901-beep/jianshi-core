name: JianShi Collect
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source registry
        run: python scripts/validate_registry.py
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collector safety state
        run: |
          echo "Production collector remains FAIL_CLOSED until Supabase staging smoke tests PASS."
