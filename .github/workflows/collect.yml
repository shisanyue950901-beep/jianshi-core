name: JianShi CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source registry
        run: python scripts/validate_registry.py
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Runtime contract
        run: |
          echo "Production collection runtime: Supabase Cron + Edge Function."
          echo "GitHub Actions is CI-only; no production database secret is required here."
