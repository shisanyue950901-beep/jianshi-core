name: JianShi Real Browser QA

on:
  pull_request:
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'tests/browser/**'
      - 'scripts/release/**'
      - 'web/build.py'
      - 'web/static/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'tests/browser/**'
      - 'scripts/release/**'
      - 'web/build.py'
      - 'web/static/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JIANSHI_API_URL: ""
      JIANSHI_AUTH_ENABLED: "0"
      JIANSHI_ANALYTICS_URL: ""
      JIANSHI_NEWSLETTER_URL: ""
    steps:
      - name: Checkout public static source
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install real Chromium and Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Rebuild public HTML from approved offline sources
        run: |
          python web/build.py
          python scripts/release/p412_build_public.py
          test -s web/dist/index.html
          test -s web/dist/discover/index.html
          test -s web/dist/academy/index.html

      - name: Run 390px and 1440px real browser interaction audit
        run: python tests/browser/real_browser_smoke.py

      - name: Publish browser screenshots and Chinese report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianshi-browser-390-1440-${{ github.run_id }}
          path: browser-smoke-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Show summary
        if: always()
        run: |
          if test -f browser-smoke-evidence/README_CN.md; then
            cat browser-smoke-evidence/README_CN.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有可用浏览器报告，检查构建/浏览器安装日志；不可标记浏览器 PASS。" >> "$GITHUB_STEP_SUMMARY"
          fi
