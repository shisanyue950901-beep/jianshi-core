name: JianShi G2-F Isolated PostgreSQL E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'db/migrations/0037_auth_launch_gate.sql'
      - 'db/migrations/0054_jianshi_cms_private_foundation.sql'
      - 'db/migrations/0055_jianshi_cms_transaction_gate.sql'
      - 'db/migrations/0056_jianshi_cms_session_guard.sql'
      - 'db/migrations/0057_jianshi_cms_historical_draft_restore.sql'
      - 'db/migrations/0058_jianshi_cms_restore_private_rpc.sql'
      - 'db/migrations/0059_jianshi_cms_trusted_role_read.sql'
      - 'db/migrations/0060_jianshi_cms_durable_bff_sessions.sql'
      - 'db/migrations/0061_jianshi_cms_pkce_one_time_state.sql'
      - 'scripts/qa/g2f_postgres_real_e2e.py'
      - 'scripts/qa/g2h5_durable_https_bff.mjs'
      - 'tests/g2h5_durable_https_pg.test.mjs'
      - 'tests/test_f21_g2h5_chain_contract.py'
      - 'db/migrations/0062_jianshi_cms_email_tokenhash_state.sql'
      - '.github/workflows/cms-postgres-isolated.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/0037_auth_launch_gate.sql'
      - 'db/migrations/0054_jianshi_cms_private_foundation.sql'
      - 'db/migrations/0055_jianshi_cms_transaction_gate.sql'
      - 'db/migrations/0056_jianshi_cms_session_guard.sql'
      - 'db/migrations/0057_jianshi_cms_historical_draft_restore.sql'
      - 'db/migrations/0058_jianshi_cms_restore_private_rpc.sql'
      - 'db/migrations/0059_jianshi_cms_trusted_role_read.sql'
      - 'db/migrations/0060_jianshi_cms_durable_bff_sessions.sql'
      - 'db/migrations/0061_jianshi_cms_pkce_one_time_state.sql'
      - 'scripts/qa/g2f_postgres_real_e2e.py'
      - 'scripts/qa/g2h5_durable_https_bff.mjs'
      - 'tests/g2h5_durable_https_pg.test.mjs'
      - 'tests/test_f21_g2h5_chain_contract.py'
      - 'db/migrations/0062_jianshi_cms_email_tokenhash_state.sql'
      - '.github/workflows/cms-postgres-isolated.yml'
permissions:
  contents: read

jobs:
  isolated-cms-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: jianshi_g2f
          POSTGRES_PASSWORD: G2F_ONLY_DISPOSABLE_FAKE_PASSWORD
        options: >-
          --health-cmd "pg_isready -U postgres -d jianshi_g2f"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert container and no external database credentials
        env:
          G2F_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          G2F_POSTGRES_DATABASE: jianshi_g2f
          JIANSHI_G2F_EPHEMERAL_ONLY: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "${JIANSHI_G2F_EPHEMERAL_ONLY}" = "1"
          test -n "${G2F_POSTGRES_CONTAINER}"
          docker inspect "${G2F_POSTGRES_CONTAINER}" --format '{{.State.Running}}' | grep -qx true
      - name: Real PostgreSQL CMS transaction and concurrency E2E
        env:
          G2F_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          G2F_POSTGRES_DATABASE: jianshi_g2f
          JIANSHI_G2F_EPHEMERAL_ONLY: "1"
        run: python scripts/qa/g2f_postgres_real_e2e.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real HTTPS to encrypted PostgreSQL BFF integration
        env:
          G2F_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          G2F_POSTGRES_DATABASE: jianshi_g2f
          JIANSHI_G2F_EPHEMERAL_ONLY: "1"
          JIANSHI_G2H5_SYNTHETIC_ONLY: "1"
        run: node --test tests/g2h5_durable_https_pg.test.mjs
      - name: Verify no production or collection workflow was invoked
        run: |
          test ! -e web/dist/prototypes/f21g2e/index.html
          test ! -e web/dist/cms-admin/index.html
